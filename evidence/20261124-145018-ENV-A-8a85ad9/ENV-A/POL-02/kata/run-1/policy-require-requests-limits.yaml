
apiVersion: policies.kyverno.io/v1
kind: NamespacedValidatingPolicy
metadata:
  name: require-requests-limits
  namespace: kvr-1738a-pol-02-kata-1
  labels: {app.kubernetes.io/part-of: kvr}
  annotations:
    policies.kyverno.io/title: "Requests CPU/mémoire et limite mémoire obligatoires"
spec:
  validationActions: ["Deny"]
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "pods/ephemeralcontainers"]
  autogen:
    podControllers:
      controllers: ["deployments", "statefulsets", "daemonsets", "jobs", "cronjobs", "replicasets"]
  variables:
    - name: workload
      expression: "object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : [])"
    - name: containers
      expression: "object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : []) + (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers : [])"
  validations:
    - message: "chaque conteneur doit déclarer requests.cpu, requests.memory et limits.memory"
      expression: "variables.workload.all(c, has(c.resources)\n  && has(c.resources.requests) && 'cpu' in c.resources.requests && 'memory' in c.resources.requests\n  && has(c.resources.limits) && 'memory' in c.resources.limits)"