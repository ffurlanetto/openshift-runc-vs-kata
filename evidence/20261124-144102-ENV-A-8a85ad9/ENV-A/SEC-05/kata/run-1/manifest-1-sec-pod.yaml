
apiVersion: v1
kind: Pod
metadata:
  name: nodecheck
  namespace: kvr-4afa6-sec-05-kata-1
  labels:
    app.kubernetes.io/part-of: kvr
spec:
  restartPolicy: Never
  terminationGracePeriodSeconds: 0
  automountServiceAccountToken: false
  containers:
    - name: main
      image: registry.access.redhat.com/ubi9/ubi@sha256:6636b79fba9e5044360366f189333c30b5ce528efd92c40c68b074592b971fcd
      imagePullPolicy: IfNotPresent
      command: ["bash", "-c", "exec sleep infinity"]
      resources:
        requests: {cpu: 100m, memory: 64Mi}
        limits: {cpu: "1", memory: 256Mi}
      securityContext:
        privileged: true
        runAsUser: 0
        runAsNonRoot: false
      volumeMounts:
        - {name: host1, mountPath: /nodetmp, readOnly: false}
  volumes:
    - name: host1
      hostPath: {path: /var/tmp, type: Directory}
