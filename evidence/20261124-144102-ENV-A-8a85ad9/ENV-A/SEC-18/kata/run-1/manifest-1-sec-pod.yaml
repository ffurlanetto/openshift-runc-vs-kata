
apiVersion: v1
kind: Pod
metadata:
  name: victim
  namespace: kvr-4afa6-sec-18-kata-1
  labels:
    app.kubernetes.io/part-of: kvr
spec:
  runtimeClassName: kata
  restartPolicy: Never
  terminationGracePeriodSeconds: 0
  automountServiceAccountToken: false
  containers:
    - name: main
      image: registry.access.redhat.com/ubi9/ubi@sha256:6636b79fba9e5044360366f189333c30b5ce528efd92c40c68b074592b971fcd
      imagePullPolicy: IfNotPresent
      command: ["bash", "-c", "\necho \"kvr-file-$KVR_TOKEN\" \u003e /tmp/kvr-file-$KVR_TOKEN\nexport KVR_MEM=\"kvr-mem-$KVR_TOKEN\"\n( while :; do echo \"kvr-net-$KVR_TOKEN\" \u003e /dev/udp/192.0.2.10/9999 2\u003e/dev/null; sleep 1; done ) \u0026\nexec -a \"kvr-proc-$KVR_TOKEN\" sleep infinity\n"]
      env:
        - {name: KVR_TOKEN, value: "89e88bc5f9042e61"}
      resources:
        requests: {cpu: 100m, memory: 64Mi}
        limits: {cpu: "1", memory: 256Mi}
      securityContext:
        runAsUser: 1001
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        seccompProfile: {type: RuntimeDefault}
