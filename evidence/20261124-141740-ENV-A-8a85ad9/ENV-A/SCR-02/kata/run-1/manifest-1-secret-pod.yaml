
apiVersion: v1
kind: Pod
metadata:
  name: consumer
  namespace: kvr-4aca1-scr-02-kata-1
  labels:
    app.kubernetes.io/part-of: kvr
spec:
  runtimeClassName: kata
  restartPolicy: Never
  terminationGracePeriodSeconds: 0
  automountServiceAccountToken: false
  containers:
    - name: main
      image: registry.access.redhat.com/ubi9/ubi-minimal@sha256:08d4c70f1baf6537a0728656cf7942d561e74a35916509d205b6519861266352
      imagePullPolicy: IfNotPresent
      command: ["sleep", "infinity"]
      resources:
        requests: {cpu: 50m, memory: 64Mi}
        limits: {cpu: 500m, memory: 256Mi}
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        capabilities: {drop: ["ALL"]}
        seccompProfile: {type: RuntimeDefault}
      env:
        - name: KVR_K00
          valueFrom: {secretKeyRef: {name: env, key: k00}}
      volumeMounts:
        - {name: few, mountPath: /secrets/few, readOnly: true}
        - {name: many, mountPath: /secrets/many, readOnly: true}
        - {name: sp-1, mountPath: /etc/kvr-k00, subPath: k00, readOnly: true}
        - {name: tmp, mountPath: /tmp}
  volumes:
    - {name: tmp, emptyDir: {}}
    - name: few
      secret:
        secretName: few
    - name: many
      secret:
        secretName: many
    - name: sp-1
      secret: {secretName: env}
