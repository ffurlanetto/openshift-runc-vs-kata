
apiVersion: v1
kind: Pod
metadata:
  name: consumer
  namespace: kvr-4aca1-scr-01-kata-1
  labels:
    app.kubernetes.io/part-of: kvr
spec:
  runtimeClassName: kata
  restartPolicy: Never
  terminationGracePeriodSeconds: 0
  automountServiceAccountToken: false
  containers:
    - name: main
      image: registry.access.redhat.com/ubi9/ubi-minimal@sha256:08d4c70f1baf6537a0728656cf7942d561e74a35916509d205b6519861266352
      imagePullPolicy: IfNotPresent
      command: ["sleep", "infinity"]
      resources:
        requests: {cpu: 50m, memory: 64Mi}
        limits: {cpu: 500m, memory: 256Mi}
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        capabilities: {drop: ["ALL"]}
        seccompProfile: {type: RuntimeDefault}
      env:
        - name: KVR_SMALL
          valueFrom: {secretKeyRef: {name: files, key: small}}
      volumeMounts:
        - {name: full, mountPath: /secrets/full, readOnly: true}
        - {name: items, mountPath: /secrets/items, readOnly: true}
        - {name: frozen, mountPath: /secrets/frozen, readOnly: true}
        - {name: missing, mountPath: /secrets/missing, readOnly: true}
        - {name: sp-1, mountPath: /etc/kvr-small, subPath: small, readOnly: true}
        - {name: projected, mountPath: /secrets/projected, readOnly: true}
        - {name: tmp, mountPath: /tmp}
  volumes:
    - {name: tmp, emptyDir: {}}
    - name: full
      secret:
        secretName: files
    - name: items
      secret:
        secretName: files
        defaultMode: 288
        items:
          - {key: binary, path: nested/bin.dat}
    - name: frozen
      secret:
        secretName: frozen
    - name: missing
      secret:
        secretName: does-not-exist
        optional: true
    - name: sp-1
      secret: {secretName: files}
    - name: projected
      projected:
        sources:
          - secret: {name: files, items: [{key: small, path: secret-small}]}
          - downwardAPI: {items: [{path: pod-name, fieldRef: {fieldPath: metadata.name}}]}
