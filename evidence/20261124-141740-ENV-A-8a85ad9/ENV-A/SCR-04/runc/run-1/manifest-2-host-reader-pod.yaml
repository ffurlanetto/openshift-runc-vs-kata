
apiVersion: v1
kind: Pod
metadata:
  name: nodeview
  namespace: kvr-4aca1-scr-04-runc-1
  labels:
    app.kubernetes.io/part-of: kvr
spec:
  nodeName: crc
  hostPID: true
  restartPolicy: Never
  terminationGracePeriodSeconds: 0
  automountServiceAccountToken: false
  containers:
    - name: main
      image: registry.access.redhat.com/ubi9/ubi@sha256:6636b79fba9e5044360366f189333c30b5ce528efd92c40c68b074592b971fcd
      imagePullPolicy: IfNotPresent
      command: ["sleep", "infinity"]
      resources:
        requests: {cpu: 100m, memory: 128Mi}
        limits: {cpu: "1", memory: 512Mi}
      securityContext:
        privileged: true
        runAsUser: 0
      volumeMounts:
        - {name: host, mountPath: /host, readOnly: true}
  volumes:
    - name: host
      hostPath: {path: /var/lib/kubelet/pods, type: Directory}
