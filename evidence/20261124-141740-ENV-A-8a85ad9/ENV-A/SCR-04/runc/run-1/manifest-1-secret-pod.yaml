
apiVersion: v1
kind: Pod
metadata:
  name: victim
  namespace: kvr-4aca1-scr-04-runc-1
  labels:
    app.kubernetes.io/part-of: kvr
spec:
  restartPolicy: Never
  terminationGracePeriodSeconds: 0
  automountServiceAccountToken: false
  containers:
    - name: main
      image: registry.access.redhat.com/ubi9/ubi-minimal@sha256:08d4c70f1baf6537a0728656cf7942d561e74a35916509d205b6519861266352
      imagePullPolicy: IfNotPresent
      command: ["sleep", "infinity"]
      resources:
        requests: {cpu: 50m, memory: 64Mi}
        limits: {cpu: 500m, memory: 256Mi}
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        capabilities: {drop: ["ALL"]}
        seccompProfile: {type: RuntimeDefault}
      env:
        - name: KVR_SECRET
          valueFrom: {secretKeyRef: {name: victim, key: value}}
      volumeMounts:
        - {name: s, mountPath: /secrets/s, readOnly: true}
        - {name: tmp, mountPath: /tmp}
  volumes:
    - {name: tmp, emptyDir: {}}
    - name: s
      secret:
        secretName: victim
