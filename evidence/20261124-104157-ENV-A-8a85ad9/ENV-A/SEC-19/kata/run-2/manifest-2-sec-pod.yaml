  namespace: kvr-a5b1b-sec-19-kata-2
  labels:
    app.kubernetes.io/part-of: kvr
spec:
  runtimeClassName: kata-qemu
  nodeName: crc
  restartPolicy: Never
  terminationGracePeriodSeconds: 0
  automountServiceAccountToken: false
  containers:
    - name: main
      image: registry.access.redhat.com/ubi9/ubi@sha256:6636b79fba9e5044360366f189333c30b5ce528efd92c40c68b074592b971fcd
