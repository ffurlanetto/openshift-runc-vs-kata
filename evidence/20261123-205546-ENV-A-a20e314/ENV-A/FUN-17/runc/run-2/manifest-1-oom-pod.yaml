apiVersion: v1
kind: Pod
metadata:
  name: oom
  namespace: kvr-4d877-fun-17-runc-2
spec:
  restartPolicy: Never
  terminationGracePeriodSeconds: 0
  automountServiceAccountToken: false
  containers:
    - name: main
      image: registry.access.redhat.com/ubi9/ubi-minimal@sha256:08d4c70f1baf6537a0728656cf7942d561e74a35916509d205b6519861266352
      imagePullPolicy: IfNotPresent
      # `tail /dev/zero` accumule une « ligne » sans fin : consommation mémoire non bornée.
      command: ["tail", "/dev/zero"]
      resources:
        requests: {cpu: 100m, memory: 128Mi}
        limits: {cpu: 500m, memory: 128Mi}
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        capabilities: {drop: ["ALL"]}
        seccompProfile: {type: RuntimeDefault}
