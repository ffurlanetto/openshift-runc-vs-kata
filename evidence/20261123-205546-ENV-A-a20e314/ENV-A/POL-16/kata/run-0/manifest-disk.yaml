
apiVersion: v1
kind: Pod
metadata: {name: disk, namespace: kvr-4d877-pol-16-kata-0}
spec:
  runtimeClassName: kata
  restartPolicy: Never
  terminationGracePeriodSeconds: 0
  automountServiceAccountToken: false
  securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
  containers:
    - name: main
      image: registry.access.redhat.com/ubi9/ubi-minimal@sha256:08d4c70f1baf6537a0728656cf7942d561e74a35916509d205b6519861266352
      command: ["bash", "-c", "head -c 300M /dev/zero > /tmp/fill; sync; sleep infinity"]
      resources:
        requests: {cpu: 50m, memory: 32Mi, ephemeral-storage: 50Mi}
        limits: {cpu: 200m, memory: 128Mi, ephemeral-storage: 100Mi}
      securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
