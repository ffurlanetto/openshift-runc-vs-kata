
apiVersion: v1
kind: Pod
metadata:
  name: policy-probe
  namespace: kvr-4d877-pol-08-kata-1
  labels: {app.kubernetes.io/part-of: kvr}
spec:
  
  runtimeClassName: kata
  restartPolicy: Never
  terminationGracePeriodSeconds: 0
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: main
      image: registry.access.redhat.com/ubi9/ubi-minimal@sha256:08d4c70f1baf6537a0728656cf7942d561e74a35916509d205b6519861266352
      imagePullPolicy: IfNotPresent
      command: ["sleep", "infinity"]
      resources:
        requests: {cpu: 50m, memory: 32Mi}
        limits: {cpu: 200m, memory: 256Mi}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - {name: host, mountPath: /host, readOnly: true}
  volumes:
    - name: host
      hostPath: {path: /etc, type: Directory}
