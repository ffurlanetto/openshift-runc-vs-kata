# Catalogue des policies Kyverno du banc (bonnes pratiques usuelles + règles propres à Kata).
# Source unique : les expressions CEL sont rendues soit en NamespacedValidatingPolicy
# (Kyverno récent, policies.kyverno.io), soit en kyverno.io/v1 Policy + validate.cel
# (Kyverno plus ancien). Toujours installées dans le namespace de test, jamais en ClusterPolicy.
#
# Variables disponibles dans les expressions :
#   variables.containers  : containers + initContainers + ephemeralContainers
#   variables.workload    : containers + initContainers (sans les conteneurs éphémères)
# Rendu Jinja : {{ kata_rc }} (RuntimeClass Kata), {{ params.* }}.

common_variables:
  - name: workload
    expression: >-
      object.spec.containers
      + (has(object.spec.initContainers) ? object.spec.initContainers : [])
  - name: containers
    expression: >-
      object.spec.containers
      + (has(object.spec.initContainers) ? object.spec.initContainers : [])
      + (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers : [])

policies:
  require-run-as-nonroot:
    title: Exécution en non-root obligatoire
    validations:
      - message: "runAsNonRoot doit être true (pod ou chaque conteneur)"
        expression: >-
          variables.containers.all(c,
            (has(c.securityContext) && has(c.securityContext.runAsNonRoot))
              ? c.securityContext.runAsNonRoot == true
              : (has(object.spec.securityContext) && has(object.spec.securityContext.runAsNonRoot)
                 && object.spec.securityContext.runAsNonRoot == true))
      - message: "runAsUser: 0 interdit"
        expression: >-
          variables.containers.all(c, !(has(c.securityContext) && has(c.securityContext.runAsUser))
            || c.securityContext.runAsUser != 0)
          && (!(has(object.spec.securityContext) && has(object.spec.securityContext.runAsUser))
            || object.spec.securityContext.runAsUser != 0)

  require-requests-limits:
    title: Requests CPU/mémoire et limite mémoire obligatoires
    validations:
      - message: "chaque conteneur doit déclarer requests.cpu, requests.memory et limits.memory"
        expression: >-
          variables.workload.all(c, has(c.resources)
            && has(c.resources.requests) && 'cpu' in c.resources.requests && 'memory' in c.resources.requests
            && has(c.resources.limits) && 'memory' in c.resources.limits)

  limit-max-resources:
    title: Plafond des limites par conteneur
    validations:
      - message: "limits.memory au-delà du plafond autorisé"
        expression: >-
          variables.workload.all(c, !has(c.resources) || !has(c.resources.limits)
            || !('memory' in c.resources.limits)
            || !quantity(c.resources.limits['memory']).isGreaterThan(quantity('{{ params.max_memory }}')))
      - message: "limits.cpu au-delà du plafond autorisé"
        expression: >-
          variables.workload.all(c, !has(c.resources) || !has(c.resources.limits)
            || !('cpu' in c.resources.limits)
            || !quantity(c.resources.limits['cpu']).isGreaterThan(quantity('{{ params.max_cpu }}')))

  disallow-privileged:
    title: Conteneurs privilégiés interdits
    validations:
      - message: "privileged: true interdit"
        expression: >-
          variables.containers.all(c, !has(c.securityContext) || !has(c.securityContext.privileged)
            || c.securityContext.privileged == false)

  disallow-privilege-escalation:
    title: Escalade de privilèges interdite
    validations:
      - message: "allowPrivilegeEscalation doit être false"
        expression: >-
          variables.containers.all(c, has(c.securityContext)
            && has(c.securityContext.allowPrivilegeEscalation)
            && c.securityContext.allowPrivilegeEscalation == false)

  restrict-capabilities:
    title: Capabilities restreintes (drop ALL, ajout NET_BIND_SERVICE seulement)
    validations:
      - message: "capabilities.drop doit contenir ALL"
        expression: >-
          variables.containers.all(c, has(c.securityContext) && has(c.securityContext.capabilities)
            && has(c.securityContext.capabilities.drop) && 'ALL' in c.securityContext.capabilities.drop)
      - message: "seule la capability NET_BIND_SERVICE peut être ajoutée"
        expression: >-
          variables.containers.all(c, !has(c.securityContext) || !has(c.securityContext.capabilities)
            || !has(c.securityContext.capabilities.add)
            || c.securityContext.capabilities.add.all(a, a == 'NET_BIND_SERVICE'))

  disallow-host-namespaces:
    title: hostNetwork / hostPID / hostIPC interdits
    validations:
      - message: "hostNetwork, hostPID et hostIPC interdits"
        expression: >-
          !(has(object.spec.hostNetwork) && object.spec.hostNetwork)
          && !(has(object.spec.hostPID) && object.spec.hostPID)
          && !(has(object.spec.hostIPC) && object.spec.hostIPC)

  disallow-host-path:
    title: Volumes hostPath interdits
    validations:
      - message: "volumes hostPath interdits"
        expression: "!has(object.spec.volumes) || object.spec.volumes.all(v, !has(v.hostPath))"

  restrict-seccomp:
    title: Profil seccomp RuntimeDefault ou Localhost obligatoire
    validations:
      - message: "seccompProfile.type doit être RuntimeDefault ou Localhost"
        expression: >-
          variables.containers.all(c,
            (has(c.securityContext) && has(c.securityContext.seccompProfile))
              ? c.securityContext.seccompProfile.type in ['RuntimeDefault', 'Localhost']
              : (has(object.spec.securityContext) && has(object.spec.securityContext.seccompProfile)
                 && object.spec.securityContext.seccompProfile.type in ['RuntimeDefault', 'Localhost']))

  require-image-digest:
    title: Images référencées par digest
    validations:
      - message: "image à référencer par digest (@sha256:…)"
        expression: "variables.containers.all(c, c.image.contains('@sha256:'))"

  privileged-requires-kata:
    title: Pod privilégié autorisé seulement dans Kata
    validations:
      - message: "un conteneur privilégié exige runtimeClassName: {{ kata_rc }}"
        expression: >-
          !variables.containers.exists(c, has(c.securityContext) && has(c.securityContext.privileged)
            && c.securityContext.privileged == true)
          || (has(object.spec.runtimeClassName) && object.spec.runtimeClassName == '{{ kata_rc }}')

  disallow-hostnetwork-kata:
    title: Pas de hostNetwork / hostPID / hostIPC avec Kata
    # Constat ENV-A (FUN-30) : un pod Kata en hostNetwork a rendu le nœud injoignable.
    # Toutes les RuntimeClass dont le nom commence par « kata » sont visées (kata, kata-qemu…).
    validations:
      - message: "hostNetwork/hostPID/hostIPC interdits avec une RuntimeClass Kata (risque de perte du nœud)"
        expression: >-
          !(has(object.spec.runtimeClassName)
            && (object.spec.runtimeClassName == '{{ kata_rc }}' || object.spec.runtimeClassName.startsWith('kata')))
          || !((has(object.spec.hostNetwork) && object.spec.hostNetwork)
               || (has(object.spec.hostPID) && object.spec.hostPID)
               || (has(object.spec.hostIPC) && object.spec.hostIPC))

  require-kata:
    title: RuntimeClass Kata obligatoire dans le namespace
    validations:
      - message: "runtimeClassName: {{ kata_rc }} obligatoire dans ce namespace"
        expression: "has(object.spec.runtimeClassName) && object.spec.runtimeClassName == '{{ kata_rc }}'"

# Mutations (rendues en NamespacedMutatingPolicy ou kyverno.io/v1 Policy patchStrategicMerge)
mutations:
  force-kata:
    title: Injection de runtimeClassName Kata si absent
    runtime_class: "{{ kata_rc }}"
